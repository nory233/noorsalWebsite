    <!-- Project: Almost Real -->
    <template data-src="p-ar">
      <div class="case-hero case-hero-ar">
        <div class="case-hero-content">
          <p class="project-number">Project 01 &middot; Bachelor's Thesis</p>
          <h2 class="case-title">Almost Real</h2>
          <p class="case-sub">AR Furniture Space Configuration App</p>
        </div>
      </div>
      <div class="case-meta">
        <span class="meta-tag meta-gold">Augmented Reality</span>
        <span class="meta-tag meta-gold">Unity 3D</span>
        <span class="meta-tag meta-gold">C#</span>
        <span class="meta-tag meta-gold">ARCore</span>
        <span class="meta-tag meta-gold">Microsoft Azure</span>
        <span class="meta-tag meta-gold">Addressables</span>
        <span class="meta-tag meta-outline">Android</span>
        <span class="meta-tag meta-outline">Bachelor's Thesis &middot; 2022</span>
      </div>
      <div class="case-full"><p class="cc-label">Overview</p><h5>What is Almost Real?</h5><p>Almost Real is an Android AR application developed as my Bachelor's thesis at the Technical University of Sofia. It allows users to visualise 3D furniture models placed in their real environment using their smartphone camera, without ever visiting a store.</p><p>Think of it as a personal IKEA Place, but built from scratch. Users scan their room, select furniture from a scrollable catalogue, spawn it into their space, and then move, scale, and rotate it until it feels right, all in real time.</p></div>
      <div class="case-grid">
        <div class="case-card"><p class="cc-label">The Problem</p><h5>Online shopping lacks spatial context</h5><p>Traditional e-commerce only shows flat images of furniture. Customers can't know if a sofa will fit their living room or match their existing decor until it arrives, often leading to costly returns and frustration.</p></div>
        <div class="case-card"><p class="cc-label">The Solution</p><h5>Try before you buy, at home</h5><p>Almost Real uses markerless AR to scan real surfaces and overlay photorealistic 3D furniture models. Users get a true sense of size, proportion, and style &mdash; from their couch, at any time.</p></div>
      </div>
      <div class="case-full"><p class="cc-label">Key Features</p><h5>What users can do</h5><ul>
        <li><strong>Spawn furniture</strong> &mdash; tap any item from the horizontal scroll catalogue to place it exactly where the AR marker sits.</li>
        <li><strong>Move it</strong> &mdash; drag the selected item across the detected plane to reposition it anywhere in the room.</li>
        <li><strong>Scale it</strong> &mdash; use the + / &minus; scale buttons to resize the object bigger or smaller.</li>
        <li><strong>Rotate it</strong> &mdash; clockwise or anti-clockwise rotation with dedicated controls.</li>
        <li><strong>Delete it</strong> &mdash; tap any spawned item and hit "Delete Item" to remove it.</li>
        <li><strong>Refresh</strong> &mdash; reset the entire scene and start fresh.</li>
        <li><strong>Info panel</strong> &mdash; a built-in guide helps first-time users get started instantly.</li>
      </ul></div>
      <div class="dark-card"><p class="cc-label">Tech Stack &amp; Architecture</p><h5>How it was built</h5><p>The app uses <strong>Google ARCore</strong> via Unity's AR Foundation for markerless plane detection. 3D models were sourced from Sketchfab, imported and configured as prefabs in Unity, then grouped as <strong>Addressables</strong> &mdash; uploaded to <strong>Microsoft Azure Blob Storage</strong> so they load dynamically at runtime without bloating the APK.</p><p>The architecture centres on five core classes: <em>PlacementIndicator</em> (raycast + marker), <em>DataHandler</em> (model list + button creation), <em>InputManagerScript</em> (all touch interactions), <em>AssetLoader</em> (async addressable loading), and <em>Item</em> (scriptable objects holding prefab + sprite data).</p><div class="pill-row"><span class="pill pill-cream">Unity 2020.3</span><span class="pill pill-cream">AR Foundation</span><span class="pill pill-cream">ARCore XR Plugin</span><span class="pill pill-cream">Microsoft Azure</span><span class="pill pill-cream">Addressables</span><span class="pill pill-cream">DOTween</span><span class="pill pill-cream">C# / Scriptable Objects</span><span class="pill pill-cream">Android 7.0+</span></div></div>
      <div class="case-grid">
        <div class="case-card"><p class="cc-label">Existing Apps</p><h5>What was missing</h5><ul><li>IKEA Place only includes ~50% of IKEA's actual catalogue and doesn't redirect to the store to purchase.</li><li>Houzz is powerful but hard to navigate, and its floor plan tool failed in furnished rooms.</li><li>Neither app gave users a truly seamless try-on-to-checkout flow.</li></ul></div>
        <div class="case-card"><p class="cc-label">My Approach</p><h5>What I did differently</h5><ul><li>Built a minimal UI that surfaces the catalogue without obscuring the AR view.</li><li>Used cloud-hosted Addressables so models load on demand, keeping the app lightweight.</li><li>Designed full interaction controls (move, scale, rotate, delete) accessible with one hand.</li></ul></div>
      </div>
      <div class="case-full"><p class="cc-label">Testing &amp; Outcomes</p><h5>What I learned from testing</h5><ul><li>Initial object spawn sizes were off &rarr; resolved by calibrating each prefab's scale in the Unity inspector before building.</li><li>Scene switching broke the AR marker &mdash; fixed by attaching the PlacementIndicator script directly to the AR Camera.</li><li>Azure connection required exact catalog files in the blob container &mdash; proper addressables rebuild resolved load errors.</li><li>Final validation: 3D objects spawn, move, scale, rotate, and delete successfully across multiple Android devices.</li></ul></div>
      <div class="case-full"><p class="cc-label">Future Scope</p><h5>Where Almost Real could go next</h5><ul><li>iOS support (currently Android only).</li><li>Direct integration with a furniture store's live product catalogue.</li><li>In-app purchase / cart redirect functionality.</li><li>Multi-language support.</li><li>Auto-generated 3D models from product images using future ML pipelines.</li><li>Would definitely redesign it, to a better modern-looking design.</li></ul></div>
      <div class="case-full"><p class="cc-label">Screenshots Demo</p><h5>Watch it in action</h5><div class="images"><img src="Picture1.jpg" class="case-image" alt="Almost Real screenshot 1"/><img src="Picture2.jpg" class="case-image" alt="Almost Real screenshot 2"/><img src="Picture3.jpg" class="case-image" alt="Almost Real screenshot 3"/><img src="Picture4.jpg" class="case-image" alt="Almost Real screenshot 4"/><img src="Picture5.jpg" class="case-image" alt="Almost Real screenshot 5"/><img src="Picture6.jpg" class="case-image" alt="Almost Real screenshot 6"/><img src="Picture7.jpg" class="case-image" alt="Almost Real screenshot 7"/><img src="Picture8.png" class="case-image" alt="Almost Real screenshot 8"/></div></div>

      <div class="case-full"><p class="cc-label">Overview</p><h5>What is Mini-World?</h5><p>Mini-World is an educational VR game developed as part of the Extended Reality course, built in a team of three. Players are shrunk down to insect size and dropped into a lush virtual garden, a world that feels alive, curious, and full of things to discover.</p><p>The game combines exploration, photography, and quiz-based interactions to form a complete learning loop: discover &rarr; capture &rarr; learn &rarr; test. Its main goal is to let children explore the hidden world of insects, helping them discover and understand organisms that are normally beyond our sight. To ensure a safe and immersive experience, the project was specifically designed in VR.</p></div>
      <div class="case-grid">
        <div class="case-card"><p class="cc-label">Level 1 &mdash; The Garden</p><h5>Explore &amp; Discover</h5><p>Players roam a virtual garden and encounter different insects hidden throughout the environment. Interacting with each insect reveals a fun educational fact about it. Players can also take in-game photos of each insect they find, which get stored in their personal <strong>journal</strong>, building a collection as they explore.</p></div>
        <div class="case-card"><p class="cc-label">Level 2 &mdash; The Quiz</p><h5>Test Your Knowledge</h5><p>After exploring the garden, players enter Level 2 &mdash; a short quiz that tests what they learned from their insect encounters. The questions are based on the facts discovered during exploration, reinforcing the learning through active recall in a playful, low-pressure format.</p></div>
      </div>
      <div class="case-full"><p class="cc-label">Key Features</p><h5>What makes Mini-World tick</h5><ul><li><strong>Starting menu with level selection</strong> &mdash; players choose their entry point from a clear menu.</li><li><strong>Insect interactions</strong> &mdash; approaching and engaging with each insect triggers a pop-up fact.</li><li><strong>In-game camera &amp; journal</strong> &mdash; players photograph each insect, photos are then stored and viewable in a journal.</li><li><strong>Quiz system</strong> &mdash; Level 2 presents questions drawn from the facts players encountered in Level 1.</li><li><strong>Data logging</strong> &mdash; all player activity is logged to a <strong>CSV file</strong> for analysis and research purposes.</li></ul></div>
